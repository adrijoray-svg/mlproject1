<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Performance Indicator</title>
    <style>
        body {
            font-family: Georgia, "Times New Roman", serif;
            margin: 30px;
            color: #000;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }
        h1.title {
            font-size: 32px;
            margin-top: 30px;
            margin-bottom: 25px;
        }
        form {
            max-width: 500px;
        }
        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .form-row label {
            flex: 0 0 200px;
            font-size: 16px;
        }
        .form-row select,
        .form-row input[type="text"],
        .form-row input[type="number"] {
            flex: 1;
            padding: 4px 8px;
            font-size: 14px;
            font-family: inherit;
            border: 1px solid #999;
            background-color: #fff;
        }
        .submit-btn {
            margin-top: 15px;
            padding: 6px 14px;
            font-size: 14px;
            font-family: inherit;
            background-color: #f0f0f0;
            border: 1px solid #999;
            cursor: pointer;
        }
        .submit-btn:hover {
            background-color: #e0e0e0;
        }
        .result {
            font-size: 28px;
            font-weight: bold;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <h1>Student Exam Performance Indicator</h1>

    <h1 class="title">Student Exam Performance Prediction</h1>

    <form action="{{ url_for('predict_datapoint') }}" method="post">

        <div class="form-row">
            <label for="gender">Gender</label>
            <select name="gender" id="gender" required>
                <option selected disabled value="">Select your Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </div>

        <div class="form-row">
            <label for="ethnicity">Race or Ethnicity</label>
            <select name="ethnicity" id="ethnicity" required>
                <option selected disabled value="">Select Ethnicity</option>
                <option value="group A">Group A</option>
                <option value="group B">Group B</option>
                <option value="group C">Group C</option>
                <option value="group D">Group D</option>
                <option value="group E">Group E</option>
            </select>
        </div>

        <div class="form-row">
            <label for="parental_level_of_education">Parental Level of Education</label>
            <select name="parental_level_of_education" id="parental_level_of_education" required>
                <option selected disabled value="">Select Parent Education</option>
                <option value="associate's degree">Associate's degree</option>
                <option value="bachelor's degree">Bachelor's degree</option>
                <option value="high school">High school</option>
                <option value="master's degree">Master's degree</option>
                <option value="some college">Some college</option>
                <option value="some high school">Some high school</option>
            </select>
        </div>

        <div class="form-row">
            <label for="lunch">Lunch Type</label>
            <select name="lunch" id="lunch" required>
                <option selected disabled value="">Select Lunch Type</option>
                <option value="free/reduced">Free/Reduced</option>
                <option value="standard">Standard</option>
            </select>
        </div>

        <div class="form-row">
            <label for="test_preparation_course">Test preparation Course</label>
            <select name="test_preparation_course" id="test_preparation_course" required>
                <option selected disabled value="">Select Test_course</option>
                <option value="none">None</option>
                <option value="completed">Completed</option>
            </select>
        </div>

        <div class="form-row">
            <label for="writing_score">Writing Score out of 100</label>
            <input type="number" name="writing_score" id="writing_score" placeholder="Enter your Writing score" min="0" max="100" required>
        </div>

        <div class="form-row">
            <label for="reading_score">Reading Score out of 100</label>
            <input type="number" name="reading_score" id="reading_score" placeholder="Enter your Reading score" min="0" max="100" required>
        </div>

        <input class="submit-btn" type="submit" value="Predict your Maths Score">

    </form>

    <h1 class="result">The prediction is {{ results }}</h1>

</body>
</html>
